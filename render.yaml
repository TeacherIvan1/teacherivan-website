services:
  - type: web
    name: teacherivan-website
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://teacherivan.com,https://www.teacherivan.com
      - key: GOOGLE_CLIENT_ID
        value: 116786083172-q1m93t06euvdsa4tdd6gs9klddhc86i9.apps.googleusercontent.com
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
