<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="dir-d-stacked-title">
  <title id="dir-d-stacked-title">Teacher Ivan - Recast Prism (Stacked Lockup)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .font-heading { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; }
      .font-mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    </style>
  </defs>

  <g id="logo-icon-mark" transform="translate(140, 40) scale(0.78125)">
    <g id="mark-keycap-slab">
      <rect x="24" y="32" width="208" height="208" rx="42" fill="#091326" />
      <rect x="24" y="24" width="208" height="208" rx="42" fill="#1A3153" stroke="#A7C7E7" stroke-width="3" stroke-opacity="0.35" />
    </g>
    <g id="mark-recast-input">
      <rect x="58" y="112" width="10" height="32" rx="5" fill="#A7C7E7" fill-opacity="0.6" />
      <rect x="76" y="94" width="10" height="68" rx="5" fill="#A7C7E7" fill-opacity="0.8" />
      <rect x="94" y="106" width="10" height="44" rx="5" fill="#A7C7E7" />
    </g>
    <line x1="116" y1="84" x2="116" y2="172" stroke="#E09B30" stroke-width="2.5" stroke-dasharray="4 4" />
    <g id="mark-recast-arrow">
      <path d="M 136 78 L 186 128 L 136 178 L 152 178 L 202 128 L 152 78 Z" fill="#E09B30" />
      <circle cx="164" cy="128" r="5" fill="#FAFAFA" />
    </g>
  </g>

  <g id="wordmark-group">
    <text x="240" y="304" text-anchor="middle" class="font-heading" font-size="44" letter-spacing="-0.02em" fill="#FAFAFA">
      TEACHER
    </text>
    <text x="240" y="356" text-anchor="middle" class="font-heading" font-size="52" letter-spacing="-0.02em" fill="#E09B30">
      IVAN
    </text>
    <g id="badge-descriptor" transform="translate(112, 386)">
      <rect x="0" y="0" width="256" height="28" rx="5" fill="#12223a" stroke="#E09B30" stroke-width="1.2" stroke-opacity="0.4" />
      <text x="128" y="18.5" text-anchor="middle" class="font-mono" font-size="11" letter-spacing="0.08em" fill="#E09B30">[ &gt;75% STT // VOICE LAB ]</text>
    </g>
  </g>
</svg>