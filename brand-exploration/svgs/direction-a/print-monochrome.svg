<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img" aria-labelledby="dir-a-mono-title">
  <title id="dir-a-mono-title">Teacher Ivan - Bicronic Resonance Monogram (Print Monochrome)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@600;700&amp;display=swap');
      .font-heading { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; }
      .font-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- 100% Solid Ink Icon Mark with Real Subtracted Negative Holes -->
  <g id="logo-icon-mark" transform="translate(16, 16) scale(0.5)">
    <!-- Solid Silhouette Slab -->
    <rect x="20" y="20" width="216" height="216" rx="48" fill="#1A3153" />
    <!-- Knockout Geometry (Pure White in Print) -->
    <rect x="52" y="52" width="88" height="24" rx="6" fill="#FAFAFA" />
    <rect x="84" y="76" width="24" height="124" rx="6" fill="#FAFAFA" />
    <!-- Acoustic Bridges -->
    <line x1="108" y1="116" x2="148" y2="116" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round" />
    <line x1="108" y1="138" x2="148" y2="138" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round" />
    <line x1="108" y1="160" x2="148" y2="160" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round" />
    <!-- Resonant I Column -->
    <rect x="148" y="76" width="24" height="124" rx="6" fill="#FAFAFA" />
    <circle cx="160" cy="56" r="10" fill="#FAFAFA" />
  </g>

  <!-- Monochrome Wordmark -->
  <g id="wordmark-group" transform="translate(164, 28)">
    <text x="0" y="62" class="font-heading" font-size="52" letter-spacing="-0.03em" fill="#1A3153">
      TEACHER IVAN
    </text>
    <g id="badge-descriptor" transform="translate(2, 84)">
      <rect x="0" y="0" width="232" height="26" rx="6" fill="none" stroke="#1A3153" stroke-width="1.5" />
      <text x="116" y="17.5" text-anchor="middle" class="font-sub" font-size="11.5" letter-spacing="0.16em" fill="#1A3153">ENGLISH FLUENCY LAB</text>
    </g>
  </g>
</svg>