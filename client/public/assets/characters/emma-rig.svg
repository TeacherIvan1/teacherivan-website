<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" role="img" aria-labelledby="emma-title">
  <title id="emma-title">Chibi Coach Emma - Vivid Full-Body Rigged SVG</title>
  <defs>
    <style>
      .rig-layer {
        transform-box: view-box;
        transition: transform 0.25s ease-out, opacity 0.15s ease-in-out;
      }
      @keyframes auraPulseEmma {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      #bg-aura {
        animation: auraPulseEmma 3.5s ease-in-out infinite;
      }
    </style>

    <!-- Vivid Woven Chambray Shirt Texture -->
    <pattern id="chambray-weave-emma" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8CC2F8" />
      <path d="M 0 0 L 8 0 M 0 4 L 8 4 M 0 0 L 0 8 M 4 0 L 4 8" stroke="#FAFAFA" stroke-width="1.1" stroke-opacity="0.55" />
      <path d="M 2 0 L 2 8 M 6 0 L 6 8 M 0 2 L 8 2 M 0 6 L 8 6" stroke="#285EA8" stroke-width="0.7" stroke-opacity="0.18" />
    </pattern>

    <!-- Subtle Warm Glow Gradient for Emma's Aura -->
    <radialGradient id="emma-aura-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAFAFA" stop-opacity="1" />
      <stop offset="75%" stop-color="#FFF7EB" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.28" />
    </radialGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. BACKGROUND AURA & GROUND SHADOW (#A7C7E7 / #E09B30)   -->
  <!-- ======================================================== -->
  <g id="bg-aura" class="rig-layer" transform-origin="300 320" style="transform-origin: 300px 320px;">
    <circle cx="300" cy="300" r="245" fill="url(#emma-aura-grad)" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.65" />
    <circle cx="300" cy="300" r="220" fill="none" stroke="#68A8F0" stroke-width="3.5" stroke-dasharray="18 14" stroke-opacity="0.8" />
    <!-- Ground Cast Shadow -->
    <ellipse cx="300" cy="542" rx="92" ry="14" fill="#1A3153" fill-opacity="0.18" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. TORSO, CHAMBRAY BLOUSE, BELT, JEANS & LOAFERS         -->
  <!-- ======================================================== -->
  <g id="torso" class="rig-layer" transform-origin="300 430" style="transform-origin: 300px 430px;">

    <!-- Rich Espresso Loafers (#4E3220) -->
    <g id="shoes">
      <path d="M 238 514 C 220 516 210 526 212 535 C 214 541 250 541 262 535 L 266 514 Z" fill="#4E3220" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
      <path d="M 218 526 Q 234 520 252 524" fill="none" stroke="#6E4730" stroke-width="3" stroke-linecap="round" />
      <path d="M 330 514 L 332 536 C 342 543 374 542 378 534 C 382 524 372 515 356 514 Z" fill="#4E3220" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
      <path d="M 342 524 Q 360 520 372 526" fill="none" stroke="#6E4730" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Saturated Indigo Denim Trousers (#2B63AC) -->
    <g id="jeans">
      <path d="M 240 422 L 360 422 C 364 456 362 490 358 520 L 328 520 L 302 464 L 296 464 L 270 520 L 236 520 C 234 490 236 456 240 422 Z" fill="#2B63AC" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
      <path d="M 294 464 L 270 520 L 260 520 L 286 458 Z" fill="#1E4B85" />
      <path d="M 304 464 L 328 520 L 338 520 L 312 458 Z" fill="#1E4B85" />
      <path d="M 238 446 Q 256 448 260 432" fill="none" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />
      <path d="M 362 446 Q 344 448 340 432" fill="none" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />
      <line x1="298" y1="434" x2="298" y2="462" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Neck Base (Vivid Warm Peach Skin #FFCC99) -->
    <path d="M 278 310 L 322 310 L 318 348 L 282 348 Z" fill="#FFCC99" stroke="#1A3153" stroke-width="5" />
    <path d="M 282 314 Q 300 326 318 314" fill="none" stroke="#F0A36A" stroke-width="4" />

    <!-- Vivid Sky-Blue Chambray Blouse with Warm Amber Neckerchief -->
    <g id="shirt-body">
      <path d="M 252 318 C 236 326 234 372 238 420 Q 300 432 362 420 C 366 372 364 326 348 318 Z" fill="url(#chambray-weave-emma)" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
      <path d="M 242 340 C 238 368 238 396 241 418 L 254 420 C 250 394 250 366 252 340 Z" fill="#5B9BD5" fill-opacity="0.35" />
      <path d="M 358 340 C 362 368 362 396 359 418 L 346 420 C 350 394 350 366 348 340 Z" fill="#5B9BD5" fill-opacity="0.35" />

      <!-- Open V-Neck Skin Triangle -->
      <polygon points="285,316 298,342 315,316" fill="#FFCC99" stroke="#1A3153" stroke-width="5" stroke-linejoin="round" />

      <!-- Vivid Warm Amber Coach Neckerchief Knot (#F59E0B) -->
      <polygon points="292,338 306,338 312,358 298,366 286,358" fill="#F59E0B" stroke="#1A3153" stroke-width="3.5" stroke-linejoin="round" />

      <!-- Crisp Shirt Collar Flaps -->
      <polygon points="274,315 268,339 292,331 285,316" fill="#FAFAFA" stroke="#1A3153" stroke-width="4.5" stroke-linejoin="round" />
      <polygon points="326,315 332,339 308,331 315,316" fill="#FAFAFA" stroke="#1A3153" stroke-width="4.5" stroke-linejoin="round" />

      <!-- Center Placket & Buttons -->
      <path d="M 298 366 Q 296 392 296 422" fill="none" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />
      <circle cx="301" cy="378" r="3" fill="#1A3153" />
      <circle cx="300" cy="396" r="3" fill="#1A3153" />
      <circle cx="300" cy="412" r="3" fill="#1A3153" />
    </g>

    <!-- Vivid Warm Amber Belt & Buckle (#E09B30 / #F59E0B) -->
    <g id="belt">
      <path d="M 237 415 Q 300 429 363 415 L 362 427 Q 300 441 238 427 Z" fill="#E09B30" stroke="#1A3153" stroke-width="4.5" stroke-linejoin="round" />
      <rect x="254" y="417" width="6" height="13" rx="2" fill="#1A3153" />
      <rect x="340" y="417" width="6" height="13" rx="2" fill="#1A3153" />
      <rect x="284" y="420" width="24" height="12" rx="3" fill="#FAFAFA" stroke="#1A3153" stroke-width="4" />
      <rect x="290" y="423" width="12" height="6" rx="1.5" fill="#1A3153" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. LEFT ARM & ROLLED CUFF + COMPACT CEFR PROP            -->
  <!-- ======================================================== -->
  <g id="left-arm-prop" class="rig-layer" transform-origin="242 332" style="transform-origin: 242px 332px;">
    <path d="M 208 386 C 204 406 204 426 210 438 C 216 447 234 446 236 432 C 238 418 236 402 236 388 Z" fill="#FFCC99" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
    <path d="M 230 390 C 232 408 232 424 228 436" fill="none" stroke="#F59E6C" stroke-width="4" stroke-linecap="round" />
    <path d="M 218 423 C 218 434 227 435 227 422" fill="none" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />

    <!-- Left Short Sleeve & Rolled Cuff -->
    <path d="M 250 320 C 226 328 212 352 208 380 L 240 384 L 244 348 Z" fill="url(#chambray-weave-emma)" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
    <path d="M 203 374 Q 222 371 241 379 L 239 392 Q 221 385 203 388 Z" fill="#74B3F0" stroke="#1A3153" stroke-width="5" stroke-linejoin="round" />

    <!-- Mini IELTS / CEFR Recast Card Prop -->
    <g transform="translate(116, 388) rotate(-6)">
      <rect x="0" y="0" width="76" height="54" rx="10" fill="#FAFAFA" stroke="#1A3153" stroke-width="4" />
      <rect x="6" y="6" width="64" height="18" rx="6" fill="#F59E0B" />
      <text x="38" y="19" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="9.5" fill="#1A3153">IELTS / B2+</text>
      <text x="12" y="38" font-family="Montserrat, sans-serif" font-weight="700" font-size="10" fill="#1A3153">Recast</text>
      <path d="M 54 31 L 59 36 L 67 27" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 4. RIGHT ARM GESTURE (PIVOTS AT SHOULDER: 358, 332)      -->
  <!-- ======================================================== -->
  <g id="right-arm-gesture" class="rig-layer" transform-origin="358 332" style="transform-origin: 358px 332px;">
    <path d="M 392 386 C 396 406 396 426 390 438 C 384 447 366 446 364 432 C 362 418 364 402 364 388 Z" fill="#FFCC99" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
    <path d="M 370 390 C 368 408 368 424 372 436" fill="none" stroke="#F59E6C" stroke-width="4" stroke-linecap="round" />
    <path d="M 364 420 C 370 424 372 432 366 436" fill="none" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />

    <!-- Right Short Sleeve & Rolled Cuff -->
    <path d="M 350 320 C 374 328 388 352 392 380 L 360 384 L 356 348 Z" fill="url(#chambray-weave-emma)" stroke="#1A3153" stroke-width="5.5" stroke-linejoin="round" />
    <path d="M 359 379 Q 378 371 397 374 L 397 388 Q 379 385 361 392 Z" fill="#74B3F0" stroke="#1A3153" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- ======================================================== -->
  <!-- 5. HEAD GROUP (BOB HAIR, GLASSES, CHIBI EYES, HEADSET)   -->
  <!-- ======================================================== -->
  <g id="head-group" class="rig-layer" transform-origin="300 310" style="transform-origin: 300px 310px;">

    <!-- Back Bob Hair Silhouette (Rich Warm Chestnut-Espresso #4E3426) -->
    <path d="M 164 236 C 158 140 208 82 300 82 C 392 82 442 140 436 236 C 434 282 412 314 380 322 L 220 322 C 188 314 166 282 164 236 Z" fill="#4E3426" stroke="#1A3153" stroke-width="6" stroke-linejoin="round" />

    <!-- Rounded Side Ears (Vivid Warm Peach #FFCC99) -->
    <g id="ears">
      <circle cx="188" cy="252" r="22" fill="#FFCC99" stroke="#1A3153" stroke-width="6" />
      <circle cx="188" cy="252" r="11" fill="#F59E6C" fill-opacity="0.45" />
      <circle cx="412" cy="252" r="22" fill="#FFCC99" stroke="#1A3153" stroke-width="6" />
      <circle cx="412" cy="252" r="11" fill="#F59E6C" fill-opacity="0.45" />
    </g>

    <!-- Wide Rounded-Square Chibi Head (Vivid Warm Peach #FFCC99) -->
    <path d="M 192 170 C 188 232 190 278 214 300 C 238 318 268 322 300 322 C 332 322 362 318 386 300 C 410 278 412 232 408 170 C 404 130 360 116 300 116 C 240 116 196 130 192 170 Z" fill="#FFCC99" stroke="#1A3153" stroke-width="6" stroke-linejoin="round" />

    <!-- Chin Shading & Rosy Cheek Glow -->
    <path d="M 218 296 Q 300 318 382 296" fill="none" stroke="#F59E6C" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55" />
    <ellipse cx="218" cy="268" rx="17" ry="9.5" fill="#F58258" fill-opacity="0.38" />
    <ellipse cx="382" cy="268" rx="17" ry="9.5" fill="#F58258" fill-opacity="0.38" />

    <!-- Swept Side-Part Bob Hair Crown & Bangs (#4E3426 + #684736 Highlight) -->
    <g id="hair-front">
      <path d="M 184 238
               C 172 194 174 142 198 112
               C 226 78 274 72 322 76
               C 374 76 414 104 424 152
               C 430 184 424 216 416 238
               L 406 196
               C 394 174 374 156 344 146
               C 314 162 256 164 206 154
               C 192 172 188 202 184 238 Z" fill="#4E3426" stroke="#1A3153" stroke-width="6" stroke-linejoin="round" />
      <path d="M 222 104 C 258 84 338 84 382 110 C 360 126 254 128 222 104 Z" fill="#684736" />
      <!-- Interior Hair Parting Lines & Vivid Amber Hair Clip -->
      <path d="M 334 112 Q 340 132 344 146" fill="none" stroke="#1A3153" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 254 124 Q 264 142 274 156" fill="none" stroke="#1A3153" stroke-width="4.5" stroke-linecap="round" />
      <rect x="366" y="146" width="24" height="9" rx="4.5" transform="rotate(16 378 150)" fill="#F59E0B" stroke="#1A3153" stroke-width="3" />
    </g>

    <!-- Expressive Arched Eyebrows -->
    <g id="eyebrows">
      <path d="M 214 196 C 234 192 254 198 264 208 C 248 204 230 200 214 201 Z" fill="#23160F" stroke="#1A3153" stroke-width="2" stroke-linejoin="round" />
      <path d="M 386 196 C 366 192 346 198 336 208 C 352 204 370 200 386 201 Z" fill="#23160F" stroke="#1A3153" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- ======================================================== -->
    <!-- 6A. EYES OPEN LAYER (Deep Oval Eyes + Eyelashes)         -->
    <!-- ======================================================== -->
    <g id="eyes-open" class="rig-layer" transform-origin="300 240" style="transform-origin: 300px 240px;" opacity="1">
      <path d="M 218 227 Q 242 214 264 229" fill="none" stroke="#1A3153" stroke-width="5.5" stroke-linecap="round" />
      <path d="M 218 227 L 211 221" stroke="#1A3153" stroke-width="4.5" stroke-linecap="round" />
      <ellipse cx="244" cy="242" rx="14" ry="18" fill="#1A2436" />
      <circle cx="240" cy="235" r="3.5" fill="#FAFAFA" fill-opacity="0.85" />

      <path d="M 336 229 Q 358 214 382 227" fill="none" stroke="#1A3153" stroke-width="5.5" stroke-linecap="round" />
      <path d="M 382 227 L 389 221" stroke="#1A3153" stroke-width="4.5" stroke-linecap="round" />
      <ellipse cx="356" cy="242" rx="14" ry="18" fill="#1A2436" />
      <circle cx="352" cy="235" r="3.5" fill="#FAFAFA" fill-opacity="0.85" />
    </g>

    <!-- ======================================================== -->
    <!-- 6B. EYES BLINK LAYER (Toggle opacity: 1)                 -->
    <!-- ======================================================== -->
    <g id="eyes-blink" class="rig-layer" transform-origin="300 240" style="transform-origin: 300px 240px;" opacity="0">
      <path d="M 222 244 Q 244 256 264 244" fill="none" stroke="#1A3153" stroke-width="5.5" stroke-linecap="round" />
      <path d="M 336 244 Q 356 256 378 244" fill="none" stroke="#1A3153" stroke-width="5.5" stroke-linecap="round" />
    </g>

    <!-- Stylish Vivid Amber Glasses (#F59E0B / #E09B30 Rim) -->
    <g id="emma-glasses">
      <rect x="208" y="212" width="70" height="52" rx="18" fill="#FAFAFA" fill-opacity="0.14" stroke="#F59E0B" stroke-width="4.5" />
      <rect x="322" y="212" width="70" height="52" rx="18" fill="#FAFAFA" fill-opacity="0.14" stroke="#F59E0B" stroke-width="4.5" />
      <path d="M 278 234 Q 300 228 322 234" fill="none" stroke="#1A3153" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Minimalist Curved Chibi Nose Tick -->
    <path d="M 297 256 C 293 263 294 268 300 270" fill="none" stroke="#1A3153" stroke-width="3.8" stroke-linecap="round" />

    <!-- ======================================================== -->
    <!-- 7A. MOUTH VISEME: SMILE (Warm Asymmetric Smirk)          -->
    <!-- ======================================================== -->
    <g id="mouth-smile" class="rig-layer" transform-origin="300 280" style="transform-origin: 300px 280px;" opacity="1">
      <path d="M 276 283 Q 304 288 325 274" fill="none" stroke="#1A3153" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 322 269 Q 328 273 327 279" fill="none" stroke="#1A3153" stroke-width="3.8" stroke-linecap="round" />
    </g>

    <!-- ======================================================== -->
    <!-- 7B. MOUTH VISEME: IDLE (Gentle Neutral Line)             -->
    <!-- ======================================================== -->
    <g id="mouth-idle" class="rig-layer" transform-origin="300 280" style="transform-origin: 300px 280px;" opacity="0">
      <path d="M 284 283 Q 300 287 316 281" fill="none" stroke="#1A3153" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- ======================================================== -->
    <!-- 7C. MOUTH VISEME: TALK OPEN (Active Speaking Sync)       -->
    <!-- ======================================================== -->
    <g id="mouth-talk-open" class="rig-layer" transform-origin="300 280" style="transform-origin: 300px 280px;" opacity="0">
      <path d="M 281 278 Q 300 275 319 278 C 321 294 311 301 300 301 C 289 301 279 294 281 278 Z" fill="#1A3153" stroke="#1A3153" stroke-width="3.5" stroke-linejoin="round" />
      <ellipse cx="300" cy="294" rx="9.5" ry="4.5" fill="#F06449" />
    </g>

    <!-- Sleek Low-Profile Coach Headset Microphone -->
    <g id="headset-mic">
      <rect x="166" y="236" width="14" height="32" rx="7" fill="#1A3153" stroke="#FAFAFA" stroke-width="2" />
      <circle cx="173" cy="252" r="4" fill="#74B3F0" />
      <path d="M 173 266 C 180 290 212 298 252 292" fill="none" stroke="#4A5568" stroke-width="4.5" stroke-linecap="round" />
      <rect x="248" y="286" width="14" height="10" rx="5" fill="#F59E0B" stroke="#1A3153" stroke-width="3" />
    </g>
  </g>
</svg>