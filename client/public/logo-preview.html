<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Ivan — Selector de Logotipos (4 Opciones Vectoriales)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Mr+Dafoe&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #091326;
      color: #FAFAFA;
      padding: 36px 24px 64px;
      line-height: 1.5;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(167,199,231,0.22);
      margin-bottom: 32px;
    }
    h1 { font-family: 'Montserrat', sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 800; }
    h1 span { color: #E09B30; }
    .subtitle { color: #A7C7E7; font-size: 14px; margin-top: 6px; max-width: 680px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(540px, 1fr)); gap: 28px; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #132642;
      border: 1px solid rgba(167,199,231,0.25);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .card.selected { border: 2px solid #E09B30; box-shadow: 0 0 32px rgba(224,155,48,0.25); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .tag { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #E09B30; text-transform: uppercase; }
    .card h2 { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700; margin-top: 2px; }
    .desc { font-size: 13px; color: #A7C7E7; margin-top: 4px; }
    .pick-btn {
      min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(224,155,48,0.6);
      background: transparent; color: #E09B30; font-family: 'Montserrat', sans-serif; font-weight: 700;
      font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .card.selected .pick-btn { background: #E09B30; color: #091326; border-color: #E09B30; }
    .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .swatch {
      border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 8px;
      border: 1px solid rgba(167,199,231,0.18);
    }
    .swatch-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.72; }
    .swatch-light { background: #FAFAFA; color: #1A3153; }
    .swatch-navy { background: #1A3153; color: #FAFAFA; }
    .swatch-midnight { background: #091326; color: #FAFAFA; }
    .swatch-mono { background: #FFFFFF; color: #000000; }
    .swatch-mono img { filter: grayscale(100%) contrast(200%) brightness(0.2); }
    .lockup-img { width: 100%; max-width: 260px; height: auto; display: block; }
    .scales {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(9,19,38,0.55); padding: 12px 16px; border-radius: 14px;
    }
    .scale-item { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #A7C7E7; }
    .status-bar {
      position: fixed; bottom: 20px; right: 20px; background: #E09B30; color: #091326;
      padding: 12px 20px; border-radius: 999px; font-family: 'Montserrat', sans-serif;
      font-weight: 800; font-size: 13px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Teacher <span>Ivan</span> — 4 Propuestas de Logotipo (.svg)</h1>
        <p class="subtitle">Comparativa en vivo sobre Fondo Claro (#FAFAFA), Deep Navy (#1A3153), Midnight (#091326), escala de barra de navegación (32px), favicon (16px) e impresión monocroma (#000000). Haz clic en tu favorito para destacarlo.</p>
      </div>
      <a href="/" style="color:#E09B30; font-family:Montserrat,sans-serif; font-weight:700; font-size:13px; text-decoration:none; padding:10px 18px; border:1px solid rgba(224,155,48,0.5); border-radius:999px;">← Volver a teacherivan.com</a>
    </header>

    <div class="grid" id="logo-grid"></div>
  </div>

  <div class="status-bar" id="status-bar"></div>

  <script>
    const options = [
      {
        id: 'opt-1',
        tag: 'OPCIÓN 01 • PORTAL ACÚSTICO',
        name: 'The Acoustic Portal Monogram',
        desc: 'Arco geométrico formado por espacio negativo "T" e "I" enmarcando un pulso acústico dorado (#E09B30) en armonía con el portal hacia la metrópoli.',
        lockup: '/assets/logo-candidates/logo-opt-1-portal.svg',
        icon: '/assets/logo-candidates/logo-opt-1-portal-icon.svg',
      },
      {
        id: 'opt-2',
        tag: 'OPCIÓN 02 • EDITORIAL SCRIPT',
        name: 'Editorial Script + Geometric Lockup',
        desc: 'Wordmark editorial de lujo que combina "TEACHER" en Montserrat SemiBold con "Ivan" en caligrafía fluida (Mr Dafoe) sobre una línea de horizonte dorada.',
        lockup: '/assets/logo-candidates/logo-opt-2-editorial.svg',
        icon: '/assets/logo-candidates/logo-opt-2-editorial-icon.svg',
      },
      {
        id: 'opt-3',
        tag: 'OPCIÓN 03 • ÓRBITA BICRÓNICA',
        name: 'The Bicronic Twin-Orbit Emblem',
        desc: 'Emblema minimalista de doble anillo fusionando #A7C7E7 (IA 24/7) y #E09B30 (Coaching 1-a-1 en vivo) en una "T" conversacional nítida incluso a 16px.',
        lockup: '/assets/logo-candidates/logo-opt-3-bicronic.svg',
        icon: '/assets/logo-candidates/logo-opt-3-bicronic-icon.svg',
      },
      {
        id: 'opt-4',
        tag: 'OPCIÓN 04 • SKYLINE CREST',
        name: 'Horizon Skyline Crest',
        desc: 'Monograma arquitectónico "TI" cuyas barras verticales ascienden como torres de metrópoli y ecualizador de voz hacia una estrella polar #E09B30.',
        lockup: '/assets/logo-candidates/logo-opt-4-skyline.svg',
        icon: '/assets/logo-candidates/logo-opt-4-skyline-icon.svg',
      },
    ];

    const grid = document.getElementById('logo-grid');
    const statusBar = document.getElementById('status-bar');
    let selectedId = null;

    function render() {
      grid.innerHTML = '';
      options.forEach((opt) => {
        const card = document.createElement('article');
        card.className = 'card' + (selectedId === opt.id ? ' selected' : '');
        card.innerHTML = `
          <div class="card-head">
            <div>
              <div class="tag">${opt.tag}</div>
              <h2>${opt.name}</h2>
              <p class="desc">${opt.desc}</p>
            </div>
            <button type="button" class="pick-btn" data-id="${opt.id}">
              ${selectedId === opt.id ? '✓ Seleccionado' : 'Elegir Favorito'}
            </button>
          </div>
          <div class="swatches">
            <div class="swatch swatch-light">
              <span class="swatch-label">Fondo Claro (#FAFAFA)</span>
              <div class="lockup-slot" data-src="${opt.lockup}"></div>
            </div>
            <div class="swatch swatch-navy">
              <span class="swatch-label">Deep Navy (#1A3153)</span>
              <div class="lockup-slot" data-src="${opt.lockup}"></div>
            </div>
            <div class="swatch swatch-midnight">
              <span class="swatch-label">Midnight (#091326)</span>
              <div class="lockup-slot" data-src="${opt.lockup}"></div>
            </div>
            <div class="swatch swatch-mono">
              <span class="swatch-label">Monocromo (#000000)</span>
              <img class="lockup-img" src="${opt.lockup}" alt="${opt.name} en monocromo" width="260" height="52" />
            </div>
          </div>
          <div class="scales">
            <div class="scale-item">
              <img src="${opt.icon}" alt="Navbar 32px" width="32" height="32" />
              <span>Navbar (32px)</span>
            </div>
            <div class="scale-item">
              <img src="${opt.icon}" alt="Favicon 16px" width="16" height="16" />
              <span>Favicon (16px)</span>
            </div>
            <div class="scale-item">
              <img src="${opt.icon}" alt="Icono 48px" width="48" height="48" />
              <span>App Icon (48px)</span>
            </div>
          </div>
        `;
        card.querySelector('.pick-btn').addEventListener('click', () => {
          selectedId = opt.id;
          statusBar.style.display = 'block';
          statusBar.textContent = 'Favorito seleccionado: ' + opt.name;
          render();
        });
        grid.appendChild(card);
      });
      // Inline SVG lockups so currentColor adapts cleanly to Light, Deep Navy, and Midnight swatches
      document.querySelectorAll('.lockup-slot').forEach(async (slot) => {
        const src = slot.getAttribute('data-src');
        if (!src) return;
        try {
          const res = await fetch(src);
          const svg = await res.text();
          slot.innerHTML = svg;
          const svgEl = slot.querySelector('svg');
          if (svgEl) {
            svgEl.style.width = '100%';
            svgEl.style.maxWidth = '260px';
            svgEl.style.height = 'auto';
            svgEl.style.display = 'block';
          }
        } catch {}
      });
    }
    render();
  </script>
</body>
</html>
