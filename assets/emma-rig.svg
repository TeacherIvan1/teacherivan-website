<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Emma AI Voice Coach Portrait">
  <defs>
    <!-- Soft Studio Backdrop Glow -->
    <radialGradient id="emma-bg-glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#2B4B7C" stop-opacity="0.52"/>
      <stop offset="58%" stop-color="#1A3153" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#091326" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Peach-Rose Cel-Shaded Skin -->
    <linearGradient id="emma-skin" x1="35%" y1="12%" x2="68%" y2="95%">
      <stop offset="0%" stop-color="#FDE9DC"/>
      <stop offset="56%" stop-color="#F7D0BC"/>
      <stop offset="100%" stop-color="#E8B19A"/>
    </linearGradient>
    <linearGradient id="emma-neck-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#DCA088"/>
      <stop offset="45%" stop-color="#F1C3AE"/>
      <stop offset="100%" stop-color="#F8D7C5"/>
    </linearGradient>
    <radialGradient id="emma-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F08B82" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F08B82" stop-opacity="0"/>
    </radialGradient>

    <!-- Sleek Chestnut-Brown Hair -->
    <linearGradient id="emma-hair-main" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#6B4439"/>
      <stop offset="42%" stop-color="#4A2D27"/>
      <stop offset="100%" stop-color="#2B1816"/>
    </linearGradient>
    <linearGradient id="emma-hair-back-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3E231F"/>
      <stop offset="100%" stop-color="#1E1010"/>
    </linearGradient>
    <linearGradient id="emma-hair-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88267" stop-opacity="0"/>
      <stop offset="35%" stop-color="#D49E80" stop-opacity="0.58"/>
      <stop offset="68%" stop-color="#E6B89A" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#B88267" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Navy High-Neck Top -->
    <linearGradient id="emma-top-grad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#24426E"/>
      <stop offset="48%" stop-color="#1A3153"/>
      <stop offset="100%" stop-color="#0E1D36"/>
    </linearGradient>

    <!-- Layered Expressive Iris (#2E3A6B -> #5E6FA8 -> #A7C7E7 crescent) -->
    <linearGradient id="emma-iris-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1F274B"/>
      <stop offset="48%" stop-color="#3B4B85"/>
      <stop offset="82%" stop-color="#6980BE"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <radialGradient id="emma-amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E09B30" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#E09B30" stop-opacity="0"/>
    </radialGradient>

    <!-- Sclera ClipPaths for Safe Gaze Tracking -->
    <clipPath id="emma-left-eye-clip">
      <path d="M214 282 C226 266, 258 266, 272 282 C264 299, 228 300, 214 282 Z"/>
    </clipPath>
    <clipPath id="emma-right-eye-clip">
      <path d="M328 282 C342 266, 374 266, 386 282 C372 300, 336 299, 328 282 Z"/>
    </clipPath>
  </defs>

  <g id="avatar-root">
    <!-- Subtle Ambient Aura -->
    <g id="bg-aura">
      <circle cx="300" cy="296" r="245" fill="url(#emma-bg-glow)"/>
    </g>

    <!-- 1. HAIR BACK (Inverse 2.5D Parallax Layer) -->
    <g id="hair-back">
      <path d="M168 232 C152 302, 148 392, 168 462 C190 486, 232 496, 300 496 C368 496, 410 486, 432 462 C452 392, 448 302, 432 232 C416 146, 368 106, 300 106 C232 106, 184 146, 168 232 Z" fill="url(#emma-hair-back-grad)"/>
      <!-- Soft inner hair rim -->
      <path d="M174 378 C184 424, 210 456, 242 466 L246 410 Z" fill="#2A1615" opacity="0.7"/>
      <path d="M426 378 C416 424, 390 456, 358 466 L354 410 Z" fill="#2A1615" opacity="0.7"/>
    </g>

    <!-- 2. TORSO GROUP (Pivot 300, 560 — Breathing) -->
    <g id="torso-group">
      <!-- Neck -->
      <path d="M262 396 L338 396 L346 476 C330 492, 270 492, 254 476 Z" fill="url(#emma-neck-grad)"/>
      <!-- Chin / Neck Shadow Wedge -->
      <g id="neck-shadow">
        <path d="M263 402 C282 426, 318 426, 337 402 L339 426 C318 442, 282 442, 261 426 Z" fill="#C98872" opacity="0.52"/>
        <!-- Subtle collarbone accents -->
        <path d="M242 478 Q272 486 286 481" fill="none" stroke="#D99B84" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M358 478 Q328 486 314 481" fill="none" stroke="#D99B84" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </g>

      <!-- Sleek Deep Navy High-Neck Top -->
      <path d="M150 584 C162 508, 206 474, 256 462 L264 438 C286 446, 314 446, 336 438 L344 462 C394 474, 438 508, 450 584 L456 600 L144 600 Z" fill="url(#emma-top-grad)"/>
      <!-- Shoulder shading planes -->
      <path d="M168 532 C194 504, 224 490, 250 484 L224 600 L150 600 Z" fill="#132642" opacity="0.58"/>
      <path d="M432 532 C406 504, 376 490, 350 484 L376 600 L450 600 Z" fill="#132642" opacity="0.58"/>
      <!-- High-neck collar seam -->
      <path d="M258 446 C284 456, 316 456, 342 446" fill="none" stroke="#A7C7E7" stroke-width="1.6" stroke-opacity="0.35"/>

      <!-- Starlight Micro-Specks & Amber Accent -->
      <g id="outfit-details">
        <circle cx="222" cy="526" r="1.8" fill="#A7C7E7" opacity="0.65"/>
        <circle cx="246" cy="552" r="1.3" fill="#FAFAFA" opacity="0.55"/>
        <circle cx="372" cy="520" r="1.8" fill="#A7C7E7" opacity="0.65"/>
        <circle cx="354" cy="558" r="1.4" fill="#FAFAFA" opacity="0.5"/>
        <circle cx="300" cy="486" r="3" fill="#E09B30" opacity="0.85"/>
        <path d="M294 486 L306 486 M300 480 L300 492" stroke="#FAFAFA" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      </g>
    </g>

    <!-- 3. HEAD GROUP (Pivot 300, 320 — Smooth Tilt + Micro-Shift) -->
    <g id="head-group">
      <!-- Ears & Signature Warm Amber Star Micro-Earpiece -->
      <g id="ears-accessories">
        <!-- Left Ear -->
        <ellipse cx="192" cy="306" rx="14" ry="22" fill="#F2C2AC"/>
        <path d="M192 294 C187 302, 187 312, 194 318" fill="none" stroke="#D99A82" stroke-width="2" stroke-linecap="round"/>
        <!-- Right Ear -->
        <ellipse cx="408" cy="306" rx="14" ry="22" fill="#F2C2AC"/>
        <path d="M408 294 C413 302, 413 312, 406 318" fill="none" stroke="#D99A82" stroke-width="2" stroke-linecap="round"/>
        <!-- Emma's Warm Amber Star Earring / Micro-Earpiece Glow (Left & Right) -->
        <circle cx="190" cy="326" r="11" fill="url(#emma-amber-glow)"/>
        <polygon points="190,318 192.4,323.6 198,326 192.4,328.4 190,334 187.6,328.4 182,326 187.6,323.6" fill="#E09B30"/>
        <circle cx="410" cy="326" r="11" fill="url(#emma-amber-glow)"/>
        <polygon points="410,318 412.4,323.6 418,326 412.4,328.4 410,334 407.6,328.4 402,326 407.6,323.6" fill="#E09B30"/>
      </g>

      <!-- Face Base (Lineless Cel-Shaded Portrait) -->
      <g id="face-base">
        <path d="M196 244 C194 176, 238 140, 300 140 C362 140, 406 176, 404 244 C403 314, 382 362, 344 394 C326 409, 312 414, 300 414 C288 414, 274 409, 256 394 C218 362, 197 314, 196 244 Z" fill="url(#emma-skin)"/>
        <!-- Subtle side-plane cel shadow -->
        <path d="M368 186 C394 218, 398 286, 384 334 C372 366, 342 396, 306 412 C340 404, 376 372, 392 332 C406 290, 405 224, 368 186 Z" fill="#DF9E86" opacity="0.34"/>
        <!-- Soft Cheek Blush -->
        <ellipse cx="232" cy="322" rx="28" ry="15" fill="url(#emma-blush)"/>
        <ellipse cx="368" cy="322" rx="28" ry="15" fill="url(#emma-blush)"/>
        <!-- Clean Nose-Tip Cel Shadow & Specular Highlight -->
        <path d="M298 292 L294 316 C294 320, 302 321, 306 318" fill="none" stroke="#D89882" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
        <ellipse cx="300" cy="312" rx="2.4" ry="4" fill="#FFF7F2" opacity="0.65"/>
      </g>

      <!-- Expressive Eyes Group -->
      <g id="eyes-group">
        <!-- Sclerae -->
        <g id="eye-left-sclera">
          <path d="M214 282 C226 266, 258 266, 272 282 C264 299, 228 300, 214 282 Z" fill="#FFFFFF"/>
          <!-- Upper sclera soft shadow -->
          <path d="M216 279 C228 269, 256 269, 270 279 C256 275, 228 275, 216 279 Z" fill="#CBD5E1" opacity="0.55"/>
        </g>
        <g id="eye-right-sclera">
          <path d="M328 282 C342 266, 374 266, 386 282 C372 300, 336 299, 328 282 Z" fill="#FFFFFF"/>
          <path d="M330 279 C344 269, 372 269, 384 279 C372 275, 344 275, 330 279 Z" fill="#CBD5E1" opacity="0.55"/>
        </g>

        <!-- Left Iris (Clipped to Sclera for Smooth Gaze Tracking) -->
        <g clip-path="url(#emma-left-eye-clip)">
          <g id="eye-left-iris">
            <ellipse cx="245" cy="283" rx="16.5" ry="17.5" fill="url(#emma-iris-grad)"/>
            <ellipse cx="245" cy="282" rx="8.5" ry="9.5" fill="#151C36"/>
            <!-- Lower crescent glow -->
            <path d="M233 290 C239 298, 251 298, 257 290 C250 294, 240 294, 233 290 Z" fill="#A7C7E7" opacity="0.88"/>
            <!-- Crisp catchlights -->
            <circle cx="238" cy="276" r="4.2" fill="#FFFFFF"/>
            <circle cx="252" cy="288" r="2.1" fill="#FFFFFF" opacity="0.9"/>
          </g>
        </g>

        <!-- Right Iris (Clipped to Sclera) -->
        <g clip-path="url(#emma-right-eye-clip)">
          <g id="eye-right-iris">
            <ellipse cx="355" cy="283" rx="16.5" ry="17.5" fill="url(#emma-iris-grad)"/>
            <ellipse cx="355" cy="282" rx="8.5" ry="9.5" fill="#151C36"/>
            <path d="M343 290 C349 298, 361 298, 367 290 C360 294, 350 294, 343 290 Z" fill="#A7C7E7" opacity="0.88"/>
            <circle cx="348" cy="276" r="4.2" fill="#FFFFFF"/>
            <circle cx="362" cy="288" r="2.1" fill="#FFFFFF" opacity="0.9"/>
          </g>
        </g>

        <!-- Eyelids Open (Default Bright Alert — Pose 2 of showcase02.jpg) -->
        <g id="eyelids-open" opacity="1">
          <!-- Left upper lash & subtle crease -->
          <path d="M210 282 C222 263, 259 262, 274 281 C260 270, 226 270, 210 282 Z" fill="#2B2129"/>
          <path d="M218 261 C234 254, 255 255, 267 262" fill="none" stroke="#C88E7A" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
          <path d="M224 298 C238 302, 254 301, 264 297" fill="none" stroke="#4A343B" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
          <!-- Right upper lash & subtle crease -->
          <path d="M390 282 C378 263, 341 262, 326 281 C340 270, 374 270, 390 282 Z" fill="#2B2129"/>
          <path d="M382 261 C366 254, 345 255, 333 262" fill="none" stroke="#C88E7A" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
          <path d="M376 298 C362 302, 346 301, 336 297" fill="none" stroke="#4A343B" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
        </g>

        <!-- Eyelids Relaxed (Focused Half-Lid — Thinking/Listening) -->
        <g id="eyelids-relaxed" opacity="0">
          <path d="M210 281 C224 270, 258 270, 274 281 L274 265 L210 265 Z" fill="#F6CEBA"/>
          <path d="M210 281 C224 272, 258 272, 274 281" fill="none" stroke="#2B2129" stroke-width="4" stroke-linecap="round"/>
          <path d="M326 281 C342 270, 376 270, 390 281 L390 265 L326 265 Z" fill="#F6CEBA"/>
          <path d="M326 281 C342 272, 376 272, 390 281" fill="none" stroke="#2B2129" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Eyelids Blink (Smooth Closed Lash Arc) -->
        <g id="eyelids-blink" opacity="0">
          <rect x="208" y="262" width="72" height="42" rx="16" fill="#F7D0BC"/>
          <path d="M213 286 C228 294, 256 294, 272 285" fill="none" stroke="#2B2129" stroke-width="3.6" stroke-linecap="round"/>
          <rect x="320" y="262" width="72" height="42" rx="16" fill="#F7D0BC"/>
          <path d="M328 285 C344 294, 372 294, 387 286" fill="none" stroke="#2B2129" stroke-width="3.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Eyebrows (Left Pivot 242, 232 | Right Pivot 358, 232) -->
      <g id="eyebrows-left">
        <path d="M214 246 C228 236, 254 235, 270 242" fill="none" stroke="#4A2D27" stroke-width="4.2" stroke-linecap="round"/>
      </g>
      <g id="eyebrows-right">
        <path d="M330 242 C346 235, 372 236, 386 246" fill="none" stroke="#4A2D27" stroke-width="4.2" stroke-linecap="round"/>
      </g>

      <!-- 6 Distinct Vector Mouth Visemes -->
      <g id="mouth-visemes">
        <!-- 1. Rest (Gentle Confident Closed Smile) -->
        <g id="mouth-rest" opacity="1">
          <path d="M276 355 C288 364, 312 364, 324 355" fill="none" stroke="#A65E58" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M288 363 C296 367, 304 367, 312 363" fill="none" stroke="#E5A296" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        </g>

        <!-- 2. Parted (Subtle Parted Lips with Tooth Highlight — showcase02.jpg) -->
        <g id="mouth-parted" opacity="0">
          <path d="M278 354 C290 349, 310 349, 322 354 C314 364, 286 364, 278 354 Z" fill="#C46B68"/>
          <path d="M285 354 C294 352, 306 352, 315 354 C308 358, 292 358, 285 354 Z" fill="#FFFFFF"/>
          <ellipse cx="300" cy="362" rx="7" ry="1.8" fill="#FFF0EC" opacity="0.55"/>
        </g>

        <!-- 3. Open Small (Soft Vowel e/i) -->
        <g id="mouth-open-sm" opacity="0">
          <path d="M276 353 C290 348, 310 348, 324 353 C316 368, 284 368, 276 353 Z" fill="#8E3B42"/>
          <path d="M283 353 C294 351, 306 351, 317 353 L314 358 L286 358 Z" fill="#FFFFFF"/>
          <path d="M288 364 C296 361, 304 361, 312 364" fill="#D97474" opacity="0.8"/>
        </g>

        <!-- 4. Open Medium (Medium Speech a) -->
        <g id="mouth-open-md" opacity="0">
          <path d="M275 351 C290 346, 310 346, 325 351 C321 374, 279 374, 275 351 Z" fill="#7D2F38"/>
          <path d="M282 351 C294 349, 306 349, 318 351 L315 357 L285 357 Z" fill="#FFFFFF"/>
          <ellipse cx="300" cy="369" rx="13" ry="5" fill="#D66D70"/>
        </g>

        <!-- 5. Open Large (Emphatic Syllable aa/oh) -->
        <g id="mouth-open-lg" opacity="0">
          <path d="M274 349 C290 343, 310 343, 326 349 C324 381, 276 381, 274 349 Z" fill="#6B2530"/>
          <path d="M281 349 C294 347, 306 347, 319 349 L316 356 L284 356 Z" fill="#FFFFFF"/>
          <ellipse cx="300" cy="373" rx="15" ry="6.5" fill="#D4666B"/>
        </g>

        <!-- 6. Smile (Warm Encouraging Smile) -->
        <g id="mouth-smile" opacity="0">
          <path d="M272 351 C286 370, 314 370, 328 351 C314 358, 286 358, 272 351 Z" fill="#FFFFFF"/>
          <path d="M272 351 C286 371, 314 371, 328 351" fill="none" stroke="#A65E58" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M275 351 C290 356, 310 356, 325 351" fill="none" stroke="#C4726C" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 4. HAIR FRONT & PARTED BANGS (Forward 2.5D Parallax Layer) -->
      <g id="hair-front-bangs">
        <!-- Crown & sleek bob framing -->
        <path d="M180 250 C176 164, 224 114, 300 114 C376 114, 424 164, 420 250 C422 320, 418 394, 394 434 C404 378, 404 316, 398 258 C392 214, 368 184, 334 176 C318 206, 296 226, 278 236 C288 212, 294 190, 296 174 C264 186, 238 214, 220 242 C226 212, 238 188, 254 174 C224 186, 206 216, 202 260 C196 318, 196 378, 206 434 C182 394, 178 320, 180 250 Z" fill="url(#emma-hair-main)"/>
        <!-- Soft Hair-Highlight Ribbons -->
        <path d="M214 196 C248 164, 352 164, 386 196 C352 178, 248 178, 214 196 Z" fill="url(#emma-hair-ribbon)"/>
        <path d="M228 208 C258 186, 342 186, 372 208 C342 197, 258 197, 228 208 Z" fill="#F2C8AE" opacity="0.22"/>
      </g>
    </g>
  </g>
</svg>
