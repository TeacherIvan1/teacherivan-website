<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Teacher Ivan Portrait">
  <defs>
    <!-- Soft Studio Backdrop Glow -->
    <radialGradient id="ivan-bg-glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#2B4B7C" stop-opacity="0.54"/>
      <stop offset="58%" stop-color="#1A3153" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#091326" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Natural Cel-Shaded Skin -->
    <linearGradient id="ivan-skin" x1="34%" y1="12%" x2="68%" y2="95%">
      <stop offset="0%" stop-color="#F8DFCC"/>
      <stop offset="55%" stop-color="#EBC3A8"/>
      <stop offset="100%" stop-color="#D7A183"/>
    </linearGradient>
    <linearGradient id="ivan-neck-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C98E70"/>
      <stop offset="48%" stop-color="#E2B598"/>
      <stop offset="100%" stop-color="#ECC7AE"/>
    </linearGradient>
    <radialGradient id="ivan-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DE8A74" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#DE8A74" stop-opacity="0"/>
    </radialGradient>

    <!-- Styled Dark Textured Hair -->
    <linearGradient id="ivan-hair-main" x1="25%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#35425C"/>
      <stop offset="45%" stop-color="#1F283B"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="ivan-hair-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7C7E7" stop-opacity="0"/>
      <stop offset="42%" stop-color="#A7C7E7" stop-opacity="0.34"/>
      <stop offset="72%" stop-color="#FAFAFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A7C7E7" stop-opacity="0"/>
    </linearGradient>

    <!-- Tailored Deep Navy Blazer & Henley -->
    <linearGradient id="ivan-blazer-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#23406A"/>
      <stop offset="50%" stop-color="#1A3153"/>
      <stop offset="100%" stop-color="#0D1C34"/>
    </linearGradient>
    <linearGradient id="ivan-henley-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#132642"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <!-- Expressive Deep Navy-Denim Iris -->
    <linearGradient id="ivan-iris-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#18223D"/>
      <stop offset="52%" stop-color="#2E4472"/>
      <stop offset="85%" stop-color="#5978B0"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>

    <!-- Sclera ClipPaths -->
    <clipPath id="ivan-left-eye-clip">
      <path d="M214 282 C226 268, 258 268, 272 282 C264 297, 228 298, 214 282 Z"/>
    </clipPath>
    <clipPath id="ivan-right-eye-clip">
      <path d="M328 282 C342 268, 374 268, 386 282 C372 298, 336 297, 328 282 Z"/>
    </clipPath>
  </defs>

  <g id="avatar-root">
    <!-- Subtle Ambient Aura -->
    <g id="bg-aura">
      <circle cx="300" cy="296" r="245" fill="url(#ivan-bg-glow)"/>
    </g>

    <!-- 1. HAIR BACK (Inverse 2.5D Parallax Layer) -->
    <g id="hair-back">
      <path d="M180 232 C176 156, 226 112, 300 112 C374 112, 424 156, 420 232 C418 268, 412 296, 404 312 L196 312 C188 296, 182 268, 180 232 Z" fill="#151C2C"/>
    </g>

    <!-- 2. TORSO GROUP (Pivot 300, 560 — Breathing) -->
    <g id="torso-group">
      <!-- Neck -->
      <path d="M254 394 L346 394 L356 476 C334 494, 266 494, 244 476 Z" fill="url(#ivan-neck-grad)"/>
      <!-- Neck Shadow Wedge -->
      <g id="neck-shadow">
        <path d="M255 400 C278 428, 322 428, 345 400 L348 430 C322 448, 278 448, 252 430 Z" fill="#B67B5F" opacity="0.52"/>
      </g>

      <!-- Collared Henley Underlayer -->
      <path d="M240 462 L360 462 L352 600 L248 600 Z" fill="url(#ivan-henley-grad)"/>
      <path d="M244 456 C276 474, 324 474, 356 456 L346 488 C318 498, 282 498, 254 488 Z" fill="#1C3559"/>

      <!-- Tailored Deep Navy Blazer -->
      <path d="M126 588 C142 504, 194 466, 250 452 L288 580 L300 584 L312 580 L350 452 C406 466, 458 504, 474 588 L478 600 L122 600 Z" fill="url(#ivan-blazer-grad)"/>
      <!-- Crisp Blazer Lapels -->
      <path d="M250 452 L226 482 L248 502 L238 518 L288 584 L294 562 Z" fill="#12243F"/>
      <path d="M350 452 L374 482 L352 502 L362 518 L312 584 L306 562 Z" fill="#12243F"/>

      <!-- Warm Amber Collar Accent & Lapel Pin -->
      <g id="outfit-details">
        <path d="M254 468 C280 480, 320 480, 346 468" fill="none" stroke="#E09B30" stroke-width="2.2" stroke-linecap="round" opacity="0.88"/>
        <!-- Subtle Amber Lapel Pin -->
        <circle cx="352" cy="516" r="4.5" fill="#E09B30"/>
        <circle cx="352" cy="516" r="1.8" fill="#FAFAFA"/>
        <!-- Henley placket micro-buttons -->
        <circle cx="300" cy="510" r="2.2" fill="#A7C7E7" opacity="0.65"/>
        <circle cx="300" cy="534" r="2.2" fill="#A7C7E7" opacity="0.65"/>
      </g>
    </g>

    <!-- 3. HEAD GROUP (Pivot 300, 320 — Smooth Tilt + Micro-Shift) -->
    <g id="head-group">
      <!-- Ears & Subtle Highlights -->
      <g id="ears-accessories">
        <ellipse cx="190" cy="306" rx="14" ry="23" fill="#E6B89C"/>
        <path d="M190 293 C185 302, 185 312, 192 319" fill="none" stroke="#C58B6E" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="410" cy="306" rx="14" ry="23" fill="#E6B89C"/>
        <path d="M410 293 C415 302, 415 312, 408 319" fill="none" stroke="#C58B6E" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Face Base (Sculpted Jawline + Subtle Neat Beard Shading) -->
      <g id="face-base">
        <path d="M194 242 C192 174, 238 138, 300 138 C362 138, 408 174, 406 242 C405 308, 386 358, 352 390 C332 409, 316 416, 300 416 C284 416, 268 409, 248 390 C214 358, 195 308, 194 242 Z" fill="url(#ivan-skin)"/>
        <!-- Subtle side-plane cel shadow -->
        <path d="M368 188 C394 220, 398 286, 386 334 C374 368, 344 398, 306 414 C342 406, 378 372, 394 332 C408 290, 406 226, 368 188 Z" fill="#C98F73" opacity="0.34"/>
        <!-- Subtle Neat Beard / Jawline Shadow -->
        <path d="M206 322 C214 360, 246 394, 276 408 C290 415, 310 415, 324 408 C354 394, 386 360, 394 322 C384 352, 358 378, 330 390 C316 396, 284 396, 270 390 C242 378, 216 352, 206 322 Z" fill="#2A3244" opacity="0.22"/>
        <!-- Soft Warm Cheek Tone -->
        <ellipse cx="234" cy="320" rx="24" ry="13" fill="url(#ivan-blush)"/>
        <ellipse cx="366" cy="320" rx="24" ry="13" fill="url(#ivan-blush)"/>
        <!-- Clean Nose Bridge & Tip Shadow -->
        <path d="M298 284 L294 316 C294 321, 303 322, 308 318" fill="none" stroke="#C58B6E" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
        <ellipse cx="300" cy="311" rx="2.4" ry="4.2" fill="#FFF7F0" opacity="0.58"/>
      </g>

      <!-- Expressive Eyes Group -->
      <g id="eyes-group">
        <g id="eye-left-sclera">
          <path d="M214 282 C226 268, 258 268, 272 282 C264 297, 228 298, 214 282 Z" fill="#FFFFFF"/>
          <path d="M216 279 C228 271, 256 271, 270 279 C256 276, 228 276, 216 279 Z" fill="#CBD5E1" opacity="0.55"/>
        </g>
        <g id="eye-right-sclera">
          <path d="M328 282 C342 268, 374 268, 386 282 C372 298, 336 297, 328 282 Z" fill="#FFFFFF"/>
          <path d="M330 279 C344 271, 372 271, 384 279 C372 276, 344 276, 330 279 Z" fill="#CBD5E1" opacity="0.55"/>
        </g>

        <g clip-path="url(#ivan-left-eye-clip)">
          <g id="eye-left-iris">
            <ellipse cx="245" cy="283" rx="15.5" ry="16" fill="url(#ivan-iris-grad)"/>
            <ellipse cx="245" cy="282" rx="8" ry="8.5" fill="#11182C"/>
            <path d="M234 289 C240 296, 250 296, 256 289 C250 293, 240 293, 234 289 Z" fill="#A7C7E7" opacity="0.82"/>
            <circle cx="239" cy="277" r="3.8" fill="#FFFFFF"/>
            <circle cx="251" cy="287" r="1.9" fill="#FFFFFF" opacity="0.88"/>
          </g>
        </g>

        <g clip-path="url(#ivan-right-eye-clip)">
          <g id="eye-right-iris">
            <ellipse cx="355" cy="283" rx="15.5" ry="16" fill="url(#ivan-iris-grad)"/>
            <ellipse cx="355" cy="282" rx="8" ry="8.5" fill="#11182C"/>
            <path d="M344 289 C350 296, 360 296, 366 289 C360 293, 350 293, 344 289 Z" fill="#A7C7E7" opacity="0.82"/>
            <circle cx="349" cy="277" r="3.8" fill="#FFFFFF"/>
            <circle cx="361" cy="287" r="1.9" fill="#FFFFFF" opacity="0.88"/>
          </g>
        </g>

        <!-- Eyelids Open -->
        <g id="eyelids-open" opacity="1">
          <path d="M210 282 C224 265, 258 264, 274 281 C260 272, 226 272, 210 282 Z" fill="#1A2233"/>
          <path d="M218 263 C234 256, 254 257, 267 264" fill="none" stroke="#BA8266" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
          <path d="M390 282 C376 265, 342 264, 326 281 C340 272, 374 272, 390 282 Z" fill="#1A2233"/>
          <path d="M382 263 C366 256, 346 257, 333 264" fill="none" stroke="#BA8266" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
        </g>

        <!-- Eyelids Relaxed (Focused Thinking/Listening) -->
        <g id="eyelids-relaxed" opacity="0">
          <path d="M210 281 C224 271, 258 271, 274 281 L274 266 L210 266 Z" fill="#EBC3A8"/>
          <path d="M210 281 C224 273, 258 273, 274 281" fill="none" stroke="#1A2233" stroke-width="3.8" stroke-linecap="round"/>
          <path d="M326 281 C342 271, 376 271, 390 281 L390 266 L326 266 Z" fill="#EBC3A8"/>
          <path d="M326 281 C342 273, 376 273, 390 281" fill="none" stroke="#1A2233" stroke-width="3.8" stroke-linecap="round"/>
        </g>

        <!-- Eyelids Blink -->
        <g id="eyelids-blink" opacity="0">
          <rect x="208" y="264" width="72" height="40" rx="16" fill="#EBC3A8"/>
          <path d="M213 286 C228 293, 256 293, 272 285" fill="none" stroke="#1A2233" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="320" y="264" width="72" height="40" rx="16" fill="#EBC3A8"/>
          <path d="M328 285 C344 293, 372 293, 387 286" fill="none" stroke="#1A2233" stroke-width="3.4" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Confident Eyebrows (Left Pivot 242, 232 | Right Pivot 358, 232) -->
      <g id="eyebrows-left">
        <path d="M210 245 C228 234, 256 234, 274 242" fill="none" stroke="#1F283B" stroke-width="6.2" stroke-linecap="round"/>
      </g>
      <g id="eyebrows-right">
        <path d="M326 242 C344 234, 372 234, 390 245" fill="none" stroke="#1F283B" stroke-width="6.2" stroke-linecap="round"/>
      </g>

      <!-- 6 Distinct Vector Mouth Visemes -->
      <g id="mouth-visemes">
        <g id="mouth-rest" opacity="1">
          <path d="M273 356 C288 365, 312 365, 327 356" fill="none" stroke="#9B5A4C" stroke-width="2.8" stroke-linecap="round"/>
        </g>
        <g id="mouth-parted" opacity="0">
          <path d="M276 355 C290 350, 310 350, 324 355 C316 365, 284 365, 276 355 Z" fill="#A6554E"/>
          <path d="M284 355 C294 353, 306 353, 316 355 C308 359, 292 359, 284 355 Z" fill="#FFFFFF"/>
        </g>
        <g id="mouth-open-sm" opacity="0">
          <path d="M274 354 C290 349, 310 349, 326 354 C318 369, 282 369, 274 354 Z" fill="#7D363B"/>
          <path d="M282 354 C294 352, 306 352, 318 354 L315 359 L285 359 Z" fill="#FFFFFF"/>
        </g>
        <g id="mouth-open-md" opacity="0">
          <path d="M273 352 C290 347, 310 347, 327 352 C322 375, 278 375, 273 352 Z" fill="#6F2B32"/>
          <path d="M281 352 C294 350, 306 350, 319 352 L316 358 L284 358 Z" fill="#FFFFFF"/>
          <ellipse cx="300" cy="370" rx="13" ry="5" fill="#C46664"/>
        </g>
        <g id="mouth-open-lg" opacity="0">
          <path d="M272 350 C290 344, 310 344, 328 350 C325 382, 275 382, 272 350 Z" fill="#5D222B"/>
          <path d="M280 350 C294 348, 306 348, 320 350 L317 357 L283 357 Z" fill="#FFFFFF"/>
          <ellipse cx="300" cy="374" rx="15" ry="6.5" fill="#C46262"/>
        </g>
        <g id="mouth-smile" opacity="0">
          <path d="M269 352 C285 372, 315 372, 331 352 C315 359, 285 359, 269 352 Z" fill="#FFFFFF"/>
          <path d="M269 352 C285 373, 315 373, 331 352" fill="none" stroke="#9B5A4C" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M273 352 C290 357, 310 357, 327 352" fill="none" stroke="#B66B5E" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 4. HAIR FRONT & TEXTURED SWEEP (Forward 2.5D Parallax Layer) -->
      <g id="hair-front-bangs">
        <path d="M188 262 C180 218, 184 166, 218 134 C252 104, 318 96, 366 118 C406 136, 424 180, 412 256 C404 226, 398 202, 386 186 C366 196, 346 202, 322 198 C332 184, 338 172, 338 164 C308 186, 268 198, 224 198 C210 214, 198 234, 188 262 Z" fill="url(#ivan-hair-main)"/>
        <!-- Subtle Cool Denim Specular Sweep -->
        <path d="M222 152 C264 126, 336 126, 376 154 C340 142, 268 142, 222 152 Z" fill="url(#ivan-hair-ribbon)"/>
      </g>
    </g>
  </g>
</svg>
